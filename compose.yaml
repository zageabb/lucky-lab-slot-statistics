services:
  lucky-lab:
    build: .
    container_name: lucky-lab
    restart: unless-stopped
    ports:
      - "5020:5020"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: sqlite:////data/lucky_lab.db
    volumes:
      - ./server-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5020/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
